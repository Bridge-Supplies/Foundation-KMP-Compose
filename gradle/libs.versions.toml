[versions]
#build info
app-packageName = "bridge.supplies.foundation"
app-name = "Foundation"
app-description = "Foundational KMP Compose template application."
app-copyright = "© 2025 Bridge Supplies. All rights reserved."
app-vendor = "Bridge Supplies"
app-versionName = "1.2.2" # "Version"
app-versionCode = "202509290" # "Build"
android-minSdk = "28"
android-targetSdk = "36"
android-compileSdk = "36"
#packages
agp = "8.13.2"
kotlin = "2.4.21"
kotlinx-datetime = "0.8.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization-json = "1.12.0"
koin = "4.2.2"
moko = "0.20.1"
androidx-core-ktx = "1.18.0"
androidx-activity-compose = "1.13.0"
compose-plugin = "1.11.1"
compose-material3 = "1.11.0-alpha07" # matched to compose-plugin 1.11.1 (still an alpha; includes Material 3 Expressive)
compose-icons-extended = "1.7.3" # material-icons-extended is frozen at 1.7.3 (no newer releases)
lifecycle-viewmodel = "2.10.0" # matched to compose-plugin version
lifecycle-viewmodel-compose = "2.10.0" # matched to compose-plugin version
navigation-compose = "2.9.2" # matched to compose-plugin version
androidx-datastore = "1.3.0"
buildconfig = "5.6.8"
korlibs-crypto = "6.0.1"
korlibs-compression = "6.0.0"
material-kolor = "4.1.1" # 5.x needs compileSdk 37 (AGP 9) — bump in FND-03
license-report = "2.9"
g0dkar-qrcode-kotlin = "4.5.0"
kscan = "0.9.2" # 0.10 needs compileSdk 37 (AGP 9) — bump in FND-03

[libraries]
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle-viewmodel"}
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose"}
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "androidx-datastore"}
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore"}
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-plugin" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-plugin" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-plugin" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-icons-extended" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-plugin" }
compose-components-ui-tooling-preview = { module = "org.jetbrains.compose.components:components-ui-tooling-preview", version.ref = "compose-plugin" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
moko-permissions = { module = "dev.icerock.moko:permissions", version.ref = "moko" }
moko-permissions-camera = { module = "dev.icerock.moko:permissions-camera", version.ref = "moko" }
moko-permissions-compose = { module = "dev.icerock.moko:permissions-compose", version.ref = "moko" }
soywiz-korlibs-crypto = { module = "com.soywiz:korlibs-crypto", version.ref = "korlibs-crypto" } # Encryption/Decryption
soywiz-korlibs-compression = { module = "com.soywiz:korlibs-compression", version.ref = "korlibs-compression" } # Zipping/unzipping
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "material-kolor" }
g0dkar-qrcode-kotlin = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "g0dkar-qrcode-kotlin" } # Android/iOS/Desktop QR generation
ismai117-kscan = { module = "io.github.ismai117:KScan", version.ref = "kscan" } # Android/iOS QR scanning

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
gmazzo-buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
jk1-license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "license-report" }