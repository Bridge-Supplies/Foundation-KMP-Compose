appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000 # the first launch after an install is slow
- waitForAnimationToEnd # the landing screen animates into the tabs; a tap during that misses
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Water"
    timeout: 5000
- tapOn: "Water"
- tapOn: "Bold"
- tapOn: "Dark"
